visuals:
  # Синтетический диалог. TODO: проверить, что вопросы не совпадают с реальным тренажёром
  - type: chat
    section: artifact
    label:
      en: "A made-up example of a dialogue with the trainer. Two questions about how the learner picked up something new at work, then a final message that suggests starting with worked examples."
      ru: "Выдуманный пример диалога с тренажёром. Два вопроса о том, как сотрудник осваивал новое на работе, и итоговое сообщение с советом начинать с разобранных примеров."
    caption:
      en: "A made-up dialogue. The questions are not from the real trainer."
      ru: "Выдуманный диалог. Вопросы не из настоящего тренажёра."
    title: { en: "Learning style check", ru: "Как вы учитесь" }
    messages:
      - from: bot
        text:
          en: "Think about the last time you had to learn something new at work. What did you do first?"
          ru: "Вспомните, когда вам последний раз нужно было освоить что-то новое на работе. С чего вы начали?"
      - from: learner
        text:
          en: "I found someone who’d done it before and asked them to show me."
          ru: "Нашёл того, кто уже это делал, и попросил показать."
      - from: bot
        text:
          en: "And when something went wrong along the way, what helped you most?"
          ru: "А когда по ходу что-то шло не так, что помогало больше всего?"
      - from: learner
        text:
          en: "Trying again on my own, then checking with them."
          ru: "Попробовать ещё раз самому, а потом свериться с ним."
      - from: bot
        final: true
        text:
          en: "Looks like you learn best by watching an example and then practicing. In this course, start with the worked examples in each module."
          ru: "Похоже, вам лучше всего подходит сначала посмотреть пример, а потом попрактиковаться. В этом курсе начинайте с разобранных примеров в каждом модуле."

