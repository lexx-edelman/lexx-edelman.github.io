decisions:
  - title:
      en: "A detailed dialogue spec or the format the platform accepts"
      ru: "Подробная спецификация диалога или формат, который принимает платформа"
    options:
      - en: "Keep the original YAML spec with a full state machine"
        ru: "Оставить исходную спецификацию в YAML с полным конечным автоматом"
      - en: "Rewrite the dialogue as three questions and a final message"
        ru: "Переписать диалог в три вопроса и итоговое сообщение"
    chosen: 1
    why:
      en: "The platform takes only a question and a “what to collect” field per step and handles follow-ups itself, so a detailed state machine had nowhere to run. I moved the logic into three well-defined questions and a final message."
      ru: "Платформа принимает на шаг только вопрос и поле «что собираем», а переспросы делает сама, поэтому подробному автомату было негде работать. Я перенёс логику в три чётких вопроса и итоговое сообщение."
  - title:
      en: "What the learning style profile is for"
      ru: "Зачем нужен профиль стиля обучения"
    options:
      - en: "Use the profile to decide how course content is structured"
        ru: "Строить по профилю структуру контента курса"
      - en: "Use the profile as a starting hypothesis that gets people engaged"
        ru: "Использовать профиль как стартовую гипотезу для вовлечения"
    chosen: 1
    why:
      en: "The Honey and Mumford profile works as a starting point for the conversation and a reason to engage. It doesn’t decide what the content looks like. TODO: check the wording."
      ru: "Профиль по Хони и Мамфорду служит отправной точкой для разговора и поводом вовлечься. Структуру контента он не определяет. TODO: проверить формулировку."

