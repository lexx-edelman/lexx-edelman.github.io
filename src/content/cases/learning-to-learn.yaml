myRole:
  me:
    en:
      - "I wrote the spec for the dialogue trainer “Find your learning style”. It described the dialogue as a state machine, along with a telemetry schema and the rules for classifying the result."
      - "When the spec met the platform, I rewrote the dialogue to fit it."
    ru:
      - "Написал спецификацию диалогового тренажёра «Определи свой стиль обучения». В ней диалог был описан как конечный автомат, плюс схема телеметрии и правила классификации результата."
      - "Когда спецификация встретилась с платформой, переписал диалог под её возможности."
  team:
