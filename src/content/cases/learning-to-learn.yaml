decisions:
  # Главный визуал кейса: режим «A vs B» с эскизами
  - title:
      en: "A detailed dialogue spec or the format the platform accepts"
      ru: "Подробная спецификация диалога или формат, который принимает платформа"
    sketches: [dialogue-graph, three-steps]
    options:
      - en: "Full dialogue engine in the original spec"
        ru: "Полный движок диалога из исходной спецификации"
      - en: "Three questions and a result, rebuilt for the platform’s constraints"
        ru: "Три вопроса и результат, пересобранные под ограничения платформы"
    chosen: 1
    between:
      en: "The platform accepts only the question text and a description of what to collect at each step. It generates follow-up questions on its own."
      ru: "Платформа принимает только текст вопроса и описание того, что собираем на каждом шаге. Уточняющие вопросы она генерирует сама."
    why:
      en: "A detailed state machine had nowhere to run on this platform, so I moved the logic into three well-defined questions and a final message."
      ru: "Подробному автомату на этой платформе было негде работать, поэтому я перенёс логику в три чётких вопроса и итоговое сообщение."
  - title:
      en: "What the learning style profile is for"
      ru: "Зачем нужен профиль стиля обучения"
    options:
      - en: "Use the profile to decide how course content is structured"
        ru: "Строить по профилю структуру контента курса"
      - en: "Use the profile as a starting hypothesis that gets people engaged"
        ru: "Использовать профиль как стартовую гипотезу для вовлечения"
    chosen: 1
    why:
      en: "The Honey and Mumford profile works as a starting point for the conversation and a reason to engage. It doesn’t decide what the content looks like. TODO: check the wording."
      ru: "Профиль по Хони и Мамфорду служит отправной точкой для разговора и поводом вовлечься. Структуру контента он не определяет. TODO: проверить формулировку."

