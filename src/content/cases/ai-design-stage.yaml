      - title: { en: "Behavior gap", ru: "Разрыв в поведении" }
        checkpoint: true
      - title: { en: "Learning outcomes", ru: "Цели обучения" }
        checkpoint: true
      - title: { en: "Practice", ru: "Практика" }
      - title: { en: "Theory", ru: "Теория" }
    end:
      title: { en: "Course build", ru: "Сборка курса" }
      note: { en: "build stage — built by a colleague", ru: "этап сборки — инструмент коллеги" }

  # Главный визуал кейса: та же цепочка на синтетическом примере (поддержка клиентов в SaaS)
  - type: chain
    section: artifact
    cover: true
    label:
      en: "Worked example in five steps, from customer support in a software company. From what agents do now, to what they should do, a learning outcome, practice, and the theory that practice needs."
      ru: "Пример в пять шагов из поддержки клиентов в софтверной компании. От того, что сотрудники делают сейчас, к тому, что должны делать, к цели обучения, практике и теории, которая для неё нужна."
    caption:
      en: "A made-up example from customer support in a SaaS company."
      ru: "Выдуманный пример из поддержки клиентов в SaaS-компании."
    steps:
      - label: { en: "What people do now", ru: "Что люди делают сейчас" }
        text:
          en: "Support agents close tickets after sending a template answer, without checking whether the problem is actually solved."
          ru: "Сотрудники поддержки закрывают обращение после шаблонного ответа и не проверяют, решена ли проблема на самом деле."
      - label: { en: "What they should do", ru: "Что они должны делать" }
        text:
          en: "Confirm the problem is solved before closing, and note what fixed it."
          ru: "Убедиться, что проблема решена, прежде чем закрыть обращение, и записать, что помогло."
      - label: { en: "Learning outcome", ru: "Цель обучения" }
        text:
          en: "Given a customer ticket, the agent verifies the resolution with the customer and documents the fix before closing."
          ru: "Получив обращение клиента, сотрудник сверяет с клиентом, что проблема решена, и фиксирует решение до закрытия."
      - label: { en: "Practice", ru: "Практика" }
        accent: true
        text:
          en: "Three simulated tickets where the template answer looks right but doesn’t solve the problem. The learner decides whether to close and why."
          ru: "Три смоделированных обращения, где шаблонный ответ выглядит верным, но проблему не решает. Сотрудник решает, закрывать ли обращение и почему."
      - label: { en: "Theory (only what practice needs)", ru: "Теория (только то, что нужно для практики)" }
        text:
          en: "A short checklist for verifying a resolution."
          ru: "Короткий чек-лист для проверки, что проблема решена."
