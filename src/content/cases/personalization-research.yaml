visuals:
  # Отвергнутые идеи — перед карточкой развилки
  - type: rejected
    section: decisions
    placement: before
    label:
      en: "Two rejected ideas. Learning styles, because there is no evidence they affect outcomes. Attention signals from video and sessions, because of unreliable data and privacy concerns."
      ru: "Две отвергнутые идеи. Стили обучения — нет доказательств, что они влияют на результат. Сигналы внимания по видео и сессиям — ненадёжные данные и вопросы приватности."
