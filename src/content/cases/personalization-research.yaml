decisions:
  - title:
      en: "Personalize by learning styles (VAK)"
      ru: "Персонализировать по стилям VAK"
    options:
      - en: "Adapt content to visual, auditory and kinesthetic learners"
        ru: "Подстраивать контент под визуалов, аудиалов и кинестетиков"
      - en: "Leave VAK out"
        ru: "Отказаться от VAK"
    chosen: 1
    why:
      en: "There’s no good evidence that matching content to VAK styles improves learning."
      ru: "Нет надёжных доказательств, что подстройка контента под стили VAK улучшает обучение."
  - title:
      en: "Use attention signals"
      ru: "Использовать сигналы внимания"
    options:
      - en: "Personalize based on attention signals"
        ru: "Персонализировать по сигналам внимания"
      - en: "Don’t use them"
        ru: "Не использовать их"
    chosen: 1
    why:
      en: "The data wasn’t reliable enough, and tracking attention raises ethical questions."
      ru: "Данные недостаточно надёжны, а отслеживание внимания вызывает этические вопросы."
  - title:
      en: "Build the infrastructure or test first"
      ru: "Строить инфраструктуру или сначала проверить"
    options:
      - en: "Build data infrastructure, then look for uses"
        ru: "Построить инфраструктуру данных, потом искать применение"
      - en: "Test the hypotheses on mockups and a small sample first"
        ru: "Сначала проверить гипотезы на макетах и малой выборке"
    chosen: 1
    why:
      en: "A hypothesis that fails on a mockup costs little. One that fails after the infrastructure is built costs the whole budget."
      ru: "Гипотеза, которая не подтвердилась на макете, стоит недорого. Та, что не подтвердилась после постройки инфраструктуры, стоит всего бюджета."

