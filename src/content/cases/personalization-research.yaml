      - title: { en: "Learning styles (visual / auditory / kinesthetic)", ru: "Стили обучения (визуалы / аудиалы / кинестетики)" }
        reason: { en: "No evidence they affect outcomes.", ru: "Нет доказательств, что они влияют на результат." }
      - title: { en: "Attention signals from video and sessions", ru: "Сигналы внимания по видео и сессиям" }
        reason: { en: "Unreliable data and privacy concerns.", ru: "Ненадёжные данные и вопросы приватности." }

  # Как проверяли: сначала дёшево
  - type: flow
    section: decisions
    label:
      en: "Three steps. Mockups, then a small test group, then a decision on infrastructure."
      ru: "Три шага. Макеты, затем небольшая тестовая группа, затем решение об инфраструктуре."
    caption:
      en: "Test the riskiest assumption first."
      ru: "Сначала проверить самое рискованное допущение."
    steps:
      - title: { en: "Mockups", ru: "Макеты" }
      - title: { en: "Small test group", ru: "Небольшая тестовая группа" }
      - title: { en: "Decide on infrastructure", ru: "Решение об инфраструктуре" }

  # Главный визуал: путь сотрудника в четыре этапа, под каждым — общий вопрос
  - type: flow
    section: artifact
    label:
      en: "The learner journey in four stages, each with a question. Choosing a course, what would make this person want to start. Starting, how they prefer to begin. Going through, what kind of feedback helps them. Finishing, did it stick."
      ru: "Путь сотрудника в четыре этапа, у каждого свой вопрос. Выбор курса — что побудит начать. Старт — как удобнее начинать. Прохождение — какая обратная связь помогает. Завершение — закрепилось ли."
    steps:
      - title: { en: "Choosing a course", ru: "Выбор курса" }
        note: { en: "What would make this person want to start?", ru: "Что побудит этого человека начать?" }
      - title: { en: "Starting", ru: "Старт" }
        note: { en: "How does this person prefer to begin?", ru: "Как этому человеку удобнее начинать?" }
      - title: { en: "Going through", ru: "Прохождение" }
        note: { en: "What kind of feedback helps them?", ru: "Какая обратная связь ему помогает?" }
      - title: { en: "Finishing", ru: "Завершение" }
        note: { en: "Did it stick?", ru: "Закрепилось ли?" }

